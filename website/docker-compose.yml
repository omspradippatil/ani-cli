services:
  # Anime Streaming Web App & API
  anime-stream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anicli-web-stream
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/trending"]
      interval: 30s
      timeout: 5s
      retries: 3

