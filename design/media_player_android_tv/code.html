<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ui-overlay {
            transition: opacity 0.5s ease-in-out;
        }
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Focus styles for buttons */
        .tv-button {
            transition: all 0.2s ease-in-out;
        }
        .tv-button:focus {
            transform: scale(1.1);
            border: 4px solid white;
            background-color: white;
            color: #0A0A0A;
            outline: none;
        }
        .tv-button:focus .material-symbols-outlined {
            color: #0A0A0A;
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col justify-between font-body-md relative">
<!-- Video Background (Placeholder) -->
<div class="absolute inset-0 z-0 bg-black">
<img alt="Video Background" class="w-full h-full object-cover opacity-80" data-alt="A breathtaking, cinematic sci-fi scene of a vast alien landscape. A massive ringed planet dominates the starry night sky. In the foreground, sleek, dark metallic structures glow with subtle, pulsating primary red lights. The atmosphere is tense and awe-inspiring, designed as a high-end, immersive background for a premium dark-mode media player interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDI6DTkv5g7tdhWn6G8sBHRz7lWOLBhMDeFQNkUQs5rdOz_G_-j0DeaZj9vk4dwp_It6aDIt-NhMBiTJFAR0_XdIhu6gG57q2KYQN3bPMhied4Mh69XMQMQGc-7zmUGR4ofoO3ibXQhpw7UstlhzM2OofXuhsc2nb7XrpB_65dAcsKEoLHMDd7Cw6_LERCNsw1lANzvOpO0cn7KNU3tcYIjPYj3yk1P55_VzexMQ2BFc7aO00SrBWMsMQ"/>
</div>
<!-- UI Overlay Container (Fades out) -->
<div class="ui-overlay absolute inset-0 z-10 flex flex-col justify-between pointer-events-auto" id="ui-container">
<!-- Top Overlay -->
<div class="pt-safe-area-y px-safe-area-x flex justify-between items-start bg-gradient-to-b from-black/80 to-transparent pb-16">
<div>
<h1 class="font-headline-lg text-headline-lg text-on-background mb-2">Neon Skyline: The Awakening</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Episode 1 - The Descent</p>
</div>
</div>
<!-- Right Overlay (Settings) -->
<div class="absolute right-safe-area-x top-1/2 -translate-y-1/2 flex flex-col gap-6">
<button aria-label="Subtitles" class="tv-button bg-white/10 p-4 rounded-full flex items-center justify-center w-[60px] h-[60px] backdrop-blur-md">
<span class="material-symbols-outlined text-white text-3xl" data-icon="subtitles">subtitles</span>
</button>
<button aria-label="Audio Settings" class="tv-button bg-white/10 p-4 rounded-full flex items-center justify-center w-[60px] h-[60px] backdrop-blur-md">
<span class="material-symbols-outlined text-white text-3xl" data-icon="volume_up">volume_up</span>
</button>
<button aria-label="Video Quality" class="tv-button bg-white/10 p-4 rounded-full flex items-center justify-center w-[60px] h-[60px] backdrop-blur-md">
<span class="material-symbols-outlined text-white text-3xl" data-icon="settings">settings</span>
</button>
</div>
<!-- Bottom Overlay -->
<div class="pb-safe-area-y px-safe-area-x bg-gradient-to-t from-black/90 to-transparent pt-32">
<!-- Progress Bar Area -->
<div class="mb-8 flex items-center gap-4">
<span class="font-label-lg text-label-lg text-on-surface-variant">24:15</span>
<div class="flex-grow h-2 bg-white/20 rounded-full relative overflow-hidden">
<!-- Progress Fill -->
<div class="absolute left-0 top-0 h-full bg-primary-container w-1/3 rounded-full"></div>
<!-- Playhead (optional, usually implied by progress end) -->
</div>
<span class="font-label-lg text-label-lg text-on-surface-variant">58:30</span>
</div>
<!-- Transport Controls -->
<div class="flex justify-center items-center gap-8">
<button aria-label="Skip Back 10 Seconds" class="tv-button bg-white/10 p-4 rounded-full flex items-center justify-center w-[60px] h-[60px]">
<span class="material-symbols-outlined text-white text-3xl" data-icon="replay_10">replay_10</span>
</button>
<!-- Play/Pause Button (Focused by default via JS) -->
<button aria-label="Play or Pause" class="tv-button bg-white/10 p-6 rounded-full flex items-center justify-center w-[80px] h-[80px]" id="play-pause-btn">
<span class="material-symbols-outlined text-white text-5xl" data-icon="play_arrow" data-weight="fill">play_arrow</span>
</button>
<button aria-label="Skip Forward 10 Seconds" class="tv-button bg-white/10 p-4 rounded-full flex items-center justify-center w-[60px] h-[60px]">
<span class="material-symbols-outlined text-white text-3xl" data-icon="forward_10">forward_10</span>
</button>
<button aria-label="Next Episode" class="tv-button bg-white/10 p-4 rounded-full flex items-center justify-center w-[60px] h-[60px] ml-16">
<span class="material-symbols-outlined text-white text-3xl" data-icon="skip_next">skip_next</span>
</button>
</div>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const uiContainer = document.getElementById('ui-container');
            const playPauseBtn = document.getElementById('play-pause-btn');
            let timeoutId;

            // Set initial focus
            playPauseBtn.focus();
            playPauseBtn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";

            const resetInactivityTimer = () => {
                uiContainer.classList.remove('fade-out');
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    // Only fade out if a focusable element inside the UI has focus, or no focus
                    // In a real TV app, you might want to maintain focus state logically even when hidden.
                    uiContainer.classList.add('fade-out');
                }, 3000);
            };

            // Listen for remote control activity (mapped to keyboard events in browser)
            document.addEventListener('keydown', resetInactivityTimer);
            document.addEventListener('mousemove', resetInactivityTimer);
            
            // Handle focus changes to update icon fill
            const buttons = document.querySelectorAll('.tv-button');
            buttons.forEach(btn => {
                btn.addEventListener('focus', () => {
                    const icon = btn.querySelector('.material-symbols-outlined');
                    if(icon) {
                        icon.style.fontVariationSettings = "'FILL' 1";
                    }
                });
                btn.addEventListener('blur', () => {
                    const icon = btn.querySelector('.material-symbols-outlined');
                    if(icon && icon.getAttribute('data-weight') !== 'fill') {
                        icon.style.fontVariationSettings = "'FILL' 0";
                    } else if (icon && icon.getAttribute('data-weight') === 'fill') {
                        // If it's meant to be filled normally, keep it filled, but maybe change color if needed
                        icon.style.fontVariationSettings = "'FILL' 1";
                    }
                });
            });

            // Initial start
            resetInactivityTimer();
        });
    </script>
</body></html>
